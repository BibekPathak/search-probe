name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Lint + RSpec
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      RAILS_ENV: test
      MONGODB_TEST_URI: mongodb://localhost:27017/searchprobe_test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t searchprobe-backend .

      - name: Build browser worker image
        run: docker build -t searchprobe-worker ./worker
